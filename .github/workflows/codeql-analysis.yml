# Raúl Miguel Tarea 3
name: "CodeQL Analysis"

# Permisos necesarios para que CodeQL pueda reportar alertas a GitHub Security
permissions:
  contents: read
  security-events: write

on:
  # Ejecuta el workflow cada vez que hay un push a la rama master
  push:
    branches: [ master ]
  # También ejecuta en cada pull request contra la rama master
  pull_request:
    branches: [ master ]
  # Y además, lo programa para que corra diariamente a la 1:00 UTC
  schedule:
    - cron: '0 1 * * *'

jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Descarga el código del repositorio en el runner de GitHub Actions
      - uses: actions/checkout@v3

      # Paso 2: Inicializa CodeQL y selecciona el lenguaje
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript  # Tu proyecto usa React, así que el lenguaje es JavaScript

      # Paso 3: Instala las dependencias y compila la app
      # Usamos --legacy-peer-deps para evitar errores de dependencias como el tuyo
      - name: Build the code
        run: |
          npm install --legacy-peer-deps   # Evita conflictos entre versiones antiguas de dependencias
          npm run build                    # Compila la app de React (esto u
