# Raúl Miguel Tarea 3
name: "CodeQL Analysis"

# Permisos necesarios para reportar resultados de seguridad a GitHub Security
permissions:
  contents: read
  security-events: write

on:
  # Ejecuta el workflow en cada push a la rama master
  push:
    branches: [ master ]
  # Ejecuta también en cada pull request a master
  pull_request:
    branches: [ master ]
  # Programa una ejecución diaria automática (1:00 UTC)
  schedule:
    - cron: '0 1 * * *'

jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga tu código en el runner de GitHub Actions
      - uses: actions/checkout@v3

      # 2. (Opcional) Muestra la versión de Node.js y npm en el log, útil para depuración
      - name: Check Node & NPM versions
        run: |
          node -v
          npm -v

      # 3. Inicializa CodeQL para JavaScript (React)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      # 4. Instala dependencias y construye el proyecto
      # Usa --legacy-peer-deps para saltar los conflictos de dependencias
      - name: Build the code
        run: |
          npm install --legacy-peer-deps    # ← ¡LA CLAVE para evitar el error!
          npm run build

      # 5. Ejecuta el análisis estático de seguridad
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
